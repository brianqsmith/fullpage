&lt;div class=&quot;row&quot;&gt;&lt;div&gt;&lt;label class=&quot;label&quot; for=&quot;nameOrder&quot;&gt;File name order&lt;/label&gt;&lt;p class=&quot;hint&quot;&gt;Choose whether the domain or “screenshot” comes first in the file name.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;control&quot;&gt;&lt;select id=&quot;nameOrder&quot;&gt;&lt;option value=&quot;website-first&quot;&gt;Website first&lt;/option&gt;&lt;option value=&quot;screenshot-first&quot;&gt;Screenshot first&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;filename-preview&quot;&gt;&lt;span&gt;Filename preview&lt;/span&gt;&lt;output id=&quot;filenamePreview&quot; aria-live=&quot;polite&quot;&gt;&lt;/output&gt;&lt;/div&gt;
&lt;div class=&quot;row&quot;&gt;&lt;div&gt;&lt;label class=&quot;label&quot; for=&quot;pause&quot;&gt;Pause between scrolls&lt;/label&gt;&lt;p class=&quot;hint&quot;&gt;Increase for pages with slow lazy-loading. Default: 150 ms.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;control&quot;&gt;&lt;input id=&quot;pause&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;10000&quot; step=&quot;1&quot; value=&quot;150&quot; aria-label=&quot;Pause between scrolls in milliseconds&quot; required&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;row&quot;&gt;&lt;div&gt;&lt;label class=&quot;label&quot; for=&quot;waitImages&quot;&gt;Wait for images&lt;/label&gt;&lt;p class=&quot;hint&quot;&gt;Wait up to 4 seconds per scroll for visible images to load.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;control&quot;&gt;&lt;input id=&quot;waitImages&quot; class=&quot;toggle&quot; type=&quot;checkbox&quot; checked&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;actions&quot;&gt;&lt;button class=&quot;primary&quot; type=&quot;submit&quot;&gt;Save settings&lt;/button&gt;&lt;span id=&quot;saved&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;/form&gt;&lt;p class=&quot;privacy&quot;&gt;Your captures stay on your device. No account, tracking, or uploads.&lt;/p&gt;&lt;/main&gt;&lt;script&gt;/* Shared validation; no page data leaves this extension. */
globalThis.Fullpage = {
  defaults: {format: &#x27;png&#x27;, pause: 150, waitImages: true, playSound: true, ask: false, nameParts: &#x27;website&#x27;, nameOrder: &#x27;website-first&#x27;, autoClose: &#x27;never&#x27;},
  normalize(value = {}) {
    const s = {...this.defaults, ...value};
    if (![&#x27;png&#x27;, &#x27;jpeg&#x27;, &#x27;pdf&#x27;].includes(s.format)) throw new Error(&#x27;Choose PNG, JPEG, or PDF.&#x27;);
    if (![&#x27;both&#x27;, &#x27;website&#x27;, &#x27;screenshot&#x27;].includes(s.nameParts)) throw new Error(&#x27;Choose which words to include in the filename.&#x27;);
    if (![&#x27;website-first&#x27;, &#x27;screenshot-first&#x27;].includes(s.nameOrder)) throw new Error(&#x27;Choose which word comes first.&#x27;);
    s.pause = Number(s.pause);
    if (!Number.isInteger(s.pause) || s.pause &lt; 0 || s.pause &gt; 10000) throw new Error(&#x27;Pause must be between 0 and 10,000 ms.&#x27;);
    delete s.folder; // Ignore the removed setting in older installations.
    s.playSound = s.playSound === true;
    s.ask = s.ask === true; s.waitImages = s.waitImages === true;
    s.autoClose = s.autoClose === true ? &#x27;after-2s&#x27; : s.autoClose === false ? &#x27;never&#x27; : s.autoClose;
    if (![&#x27;never&#x27;, &#x27;immediately&#x27;, &#x27;after-2s&#x27;].includes(s.autoClose)) throw new Error(&#x27;Choose when the progress box should close.&#x27;);
    return s;
  },
  savedMessage(item, s) {
    const path = String(item?.filename || &#x27;&#x27;).replace(/\\/g, &#x27;/&#x27;);
    const directory = path.split(&#x27;/&#x27;).slice(0, -1).filter(Boolean).pop();
    const folder = directory ? (/^downloads$/i.test(directory) ? &#x27;downloads&#x27; : directory) : (s.ask ? &#x27;your chosen folder&#x27; : &#x27;downloads&#x27;);
    return `${s.format === &#x27;pdf&#x27; ? &#x27;PDF&#x27; : &#x27;Image&#x27;} saved to ${folder}`;
  },
  filename(title, s, date = new Date(), url = &#x27;&#x27;) {
    let website = title || &#x27;website&#x27;;
    try { website = new URL(url).hostname.replace(/^www\./, &#x27;&#x27;) || website; } catch (_) {}
    website = website.replace(/[\\/:*?&quot;&lt;&gt;|\x00-\x1f]/g, &#x27;-&#x27;).replace(/[. ]+$/g, &#x27;&#x27;).slice(0, 90) || &#x27;website&#x27;;
    const parts = s.nameParts || &#x27;website&#x27;;
    const name = parts === &#x27;website&#x27; ? website : parts === &#x27;screenshot&#x27; ? &#x27;screenshot&#x27; : (s.nameOrder === &#x27;screenshot-first&#x27; ? [&#x27;screenshot&#x27;, website] : [website, &#x27;screenshot&#x27;]).join(&#x27; — &#x27;);
    return name + &#x27; — &#x27; + date.toISOString().replace(/[:.]/g, &#x27;-&#x27;) + &#x27;.&#x27; + (s.format === &#x27;jpeg&#x27; ? &#x27;jpg&#x27; : s.format);
  }
};
&lt;/script&gt;&lt;script&gt;const form = document.querySelector(&#x27;#settings&#x27;), saved = document.querySelector(&#x27;#saved&#x27;);
async function load() {
  try {
    const s = Fullpage.normalize(await browser.storage.local.get(Fullpage.defaults));
    form.elements.format.value = s.format;
    for (const key of [&#x27;pause&#x27;, &#x27;nameParts&#x27;, &#x27;nameOrder&#x27;, &#x27;autoClose&#x27;]) document.getElementById(key).value = s[key];
    for (const key of [&#x27;waitImages&#x27;, &#x27;ask&#x27;, &#x27;playSound&#x27;]) document.getElementById(key).checked = s[key];
    preview();
  } catch (e) { saved.textContent = e.message; }
}
function values() {
  return {playSound: document.getElementById(&#x27;playSound&#x27;).checked, format: form.elements.format.value, pause: document.getElementById(&#x27;pause&#x27;).value, nameParts: document.getElementById(&#x27;nameParts&#x27;).value, nameOrder: document.getElementById(&#x27;nameOrder&#x27;).value, waitImages: document.getElementById(&#x27;waitImages&#x27;).checked, ask: document.getElementById(&#x27;ask&#x27;).checked, autoClose: document.getElementById(&#x27;autoClose&#x27;).value};
}
const previewDate = new Date();
function preview() {
  const s = values();
  document.getElementById(&#x27;nameOrder&#x27;).disabled = s.nameParts !== &#x27;both&#x27;;
  document.getElementById(&#x27;filenamePreview&#x27;).textContent = Fullpage.filename(&#x27;Example&#x27;, s, previewDate, &#x27;https://example.com&#x27;);
}
form.addEventListener(&#x27;input&#x27;, () =&gt; { saved.textContent = &#x27;Unsaved changes&#x27;; preview(); });
form.addEventListener(&#x27;submit&#x27;, async e =&gt; {
  e.preventDefault();
  try {
    const s = Fullpage.normalize(values());
    await browser.storage.local.set(s); saved.textContent = &#x27;Settings saved&#x27;;
  } catch (error) { saved.textContent = error.message; }
});
load();
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;
